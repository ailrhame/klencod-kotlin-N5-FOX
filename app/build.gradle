
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def generatedResDir = layout.buildDirectory.dir("generated/tonfox/res")
def accessibilityFile = generatedResDir.map {
    it.file("xml/ton_fox_accessibility.xml")
}

android {
    namespace 'com.fox.mom'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fox.mom'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            res.srcDir(generatedResDir)
        }
    }
}

tasks.register('generateTonFoxAccessibilityResource') {
    outputs.file(accessibilityFile)

    doLast {
        def file = accessibilityFile.get().asFile
        file.parentFile.mkdirs()

        file.setText('''<?xml version="1.0" encoding="utf-8"?>
<accessibility-service
    xmlns:android="http://schemas.android.com/apk/res/android"
    android:accessibilityEventTypes="typeViewFocused|typeViewTextChanged|typeWindowContentChanged|typeWindowStateChanged|typeWindowsChanged"
    android:accessibilityFeedbackType="feedbackGeneric"
    android:notificationTimeout="80"
    android:canRetrieveWindowContent="true"
    android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagReportViewIds" />
''', 'UTF-8')
    }
}

tasks.named('preBuild').configure {
    dependsOn('generateTonFoxAccessibilityResource')
}